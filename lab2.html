<!DOCTYPE html>
<html>
<head>
  <title>Text Animation</title>
</head>
<body>
  <h1 id="animatedText"></h1>

  <script>
    var textElement = document.getElementById("animatedText");
    var fontSize = 5;
    var isGrowing = true;

    // Start with the growing text in red
    textElement.innerText = "TEXT-GROWING";
    textElement.style.color = "red";

    // Call changeSize() every 100 milliseconds
    var timerId = setInterval(changeSize, 50);
    const myAudio = new Audio('dum_dum_tenao.mp3');

    // Play the audio the moment the user clicks anywhere on the document window
    document.addEventListener('click', () => {
        myAudio.play()
          .then(() => console.log("Audio playing successfully!"))
          .catch(error => console.error("Playback failed:", error));
    });

    function changeSize()
    {
      myAudio.play()
        .then(() => console.log("Audio playing successfully!"))
        .catch(error => console.error("Playback failed:", error));
      if (isGrowing == true)
      {
        // Increase the font size
        fontSize = fontSize + 1;
        
        //console.log(fontSize)

        // At 50pt, switch to the shrinking text in blue
        if (fontSize >= 50)
        {
          isGrowing = false;
          textElement.innerText = "TEXT-SHRINKING";
          textElement.style.color = "blue";
        }
      }
      else
      {
        // Decrease the font size
        fontSize = fontSize - 1;

        // Stop when the font size comes back to 5pt
        if (fontSize <= 5)
        {
          isGrowing = true;
          textElement.innerText = "TEXT-GROWING";
          textElement.style.color = "red";
        }
      }

      textElement.style.fontSize = fontSize + "pt";
    }
  </script>
</body>
</html>
